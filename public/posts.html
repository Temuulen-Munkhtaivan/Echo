<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Posts - Echo</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <main>
        <h1>Echo Posts</h1>
        <p>See what everyone is sharing.</p>

        <a href="/create-post.html">Create a Post</a>

        <section id="posts"></section>
        <p id="message">Loading posts...</p>

        <a href="/">Back to Echo</a>
    </main>
    <!-- Delete Post Confirmation Popup -->
    <dialog id="deleteDialog" aria-labelledby="deleteDialogTitle">
        <h2 id="deleteDialogTitle">Delete Post?</h2>

        <p id="deleteDialogMessage"></p>

        <p id="deleteDialogError" role="alert" hidden></p>

        <div class="delete-dialog-buttons">
            <button type="button" id="cancelDelete">
                Cancel
            </button>

            <button type="button" id="confirmDelete">
                Delete Post
            </button>
        </div>
    </dialog>
    <script src="/csrf.js"></script>
    <script src="/posts.js"></script>
</body>
</html>
