<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Posts - Echo</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <main>
        <h1>Echo Posts</h1>
        <p>See what everyone is sharing.</p>

        <a href="/create-post.html">Create a Post</a>

        <p id="authorFilter" hidden></p>
        <a href="/posts.html" id="showAllPosts" hidden>Show All Posts</a>

        <section id="posts"></section>
        <p id="message">Loading posts...</p>

        <a href="/">Back to Echo</a>
    </main>

    <script>
        async function loadPosts() {
            const container = document.getElementById("posts");
            const message = document.getElementById("message");

            try {
                // Retrieve posts from Express
                const response = await fetch("/posts");

                if (!response.ok) {
                    throw new Error("Failed to retrieve posts");
                }

                const posts = await response.json();

                // Check who is currently logged in
                const userResponse = await fetch("/me");

                const currentUser = userResponse.ok
                    ? await userResponse.json()
                    : null;

                // Read the author from the URL
                const selectedAuthor = new URLSearchParams(
                    window.location.hash.slice(1)
                ).get("author");

                // Filter posts by author
                const filteredPosts = selectedAuthor
                    ? posts.filter(post => post.author === selectedAuthor)
                    : posts;

                const authorFilter = document.getElementById("authorFilter");
                const showAllPosts = document.getElementById("showAllPosts");

                authorFilter.hidden = !selectedAuthor;
                showAllPosts.hidden = !selectedAuthor;

                // INTENTIONALLY VULNERABLE: DOM-based XSS
                authorFilter.innerHTML = selectedAuthor
                    ? "Showing posts by: " + selectedAuthor
                    : "";

                container.replaceChildren();
                message.textContent = "";

                if (filteredPosts.length === 0) {
                    message.textContent = selectedAuthor
                        ? "No posts found for this user."
                        : "No posts yet.";
                    return;
                }

                // Display each post
                filteredPosts.forEach(post => {
                    const article = document.createElement("article");
                    const title = document.createElement("h2");
                    const author = document.createElement("p");
                    const content = document.createElement("p");

                    title.textContent = post.title;
                    author.textContent = "Posted by ";

                    const authorLink = document.createElement("a");

                    authorLink.href = "#author=" + encodeURIComponent(post.author);
                    authorLink.textContent = post.author;

                    author.appendChild(authorLink);
                    content.innerHTML = post.content;

                    content.style.whiteSpace = "pre-wrap";

                    article.appendChild(title);
                    article.appendChild(author);
                    article.appendChild(content);

                    // Only show Edit if the logged-in user owns the post
                    if (currentUser && post.user_id === currentUser.userId) {
                    // Edit link
                    const editLink = document.createElement("a");

                    editLink.href = "/edit-post.html?id=" + post.id;
                    editLink.textContent = "Edit";

                    article.appendChild(editLink);

                    // Delete form
                    const deleteForm = document.createElement("form");

                    deleteForm.method = "POST";
                    deleteForm.action = "/posts/" + post.id + "/delete";

                    const deleteButton = document.createElement("button");

                    deleteButton.type = "submit";
                    deleteButton.textContent = "Delete";

                    deleteForm.appendChild(deleteButton);

                    // Ask for confirmation before deleting
                    deleteForm.addEventListener("submit", (event) => {
                        if (!confirm("Are you sure you want to delete this post?")) {
                            event.preventDefault();
                        }
                    });

                    article.appendChild(deleteForm);
                }
                    // Admins can remove posts belonging to other users
                    if (
                        currentUser &&
                        currentUser.role === "admin" &&
                        post.user_id !== currentUser.userId
                    ) {
                        const adminForm = document.createElement("form");

                        adminForm.method = "POST";
                        adminForm.action = "/admin/posts/" + post.id + "/delete";

                        const removeButton = document.createElement("button");

                        removeButton.type = "submit";
                        removeButton.textContent = "Remove Post";

                        adminForm.appendChild(removeButton);

                        // Confirm moderation action
                        adminForm.addEventListener("submit", (event) => {
                            if (!confirm("Remove this user's post? This cannot be undone.")) {
                                event.preventDefault();
                            }
                        });

                        article.appendChild(adminForm);
                    }

                    container.appendChild(article);
                });

            } catch (err) {
                message.textContent = "Unable to load posts.";
            }
        }

        loadPosts();
        window.addEventListener("hashchange", loadPosts);
    </script>
</body>
</html>
