<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Echo</title>
    <meta name="description" content="Echo is a community blog where users can read posts, search for topics, and share their own stories.">

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <header>
        <h1>Echo</h1>

        <nav>
            <a href="/">Home</a>
            <a href="/posts.html">Posts</a>
            <a href="/search">Search</a>

            <a href="/create-post.html" id="createPostLink" hidden>
                Create Post
            </a>

            <a href="/login.html" id="loginLink" hidden>
                Login
            </a>

            <a href="/register.html" id="registerLink" hidden>
                Register
            </a>

            <span id="usernameDisplay" hidden></span>

            <form action="/logout" method="POST" id="logoutForm" hidden>
                <button type="submit">Log Out</button>
            </form>
        </nav>
    </header>

    <main>
        <h2>Welcome to Echo</h2>

        <p>A place to share your thoughts and stories.</p>

        <section>
            <h3>Recent Posts</h3>

            <div id="recent-posts">
                <p>Loading posts...</p>
            </div>

            <a href="/posts.html">View All Posts</a>
        </section>
    </main>

    <!-- CSRF protection -->
    <script src="/csrf.js"></script>
    <script src="/form-csrf.js"></script>

    <!-- Homepage functionality -->
    <script src="/nav.js"></script>
    <script src="/home.js"></script>

</body>

</html>
