<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Echo</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <main>
        <h1>Welcome Back</h1>
        <p>Log in to your Echo account.</p>

        <form id="loginForm" action="/login" method="POST">
            <label for="email">Email</label>
            <input type="email" id="email" name="email"
                autocomplete="email" required>

            <label for="password">Password</label>
            <input type="password" id="password" name="password"
                autocomplete="current-password" required>

            <button type="submit">Log In</button>
        </form>

        <p>
            Don't have an account?
            <a href="/register.html">Register here</a>
        </p>
    </main>

    <!-- Login error popup -->
    <dialog id="loginErrorDialog" aria-labelledby="loginErrorTitle">
        <h2 id="loginErrorTitle">Login Failed</h2>

        <p id="loginErrorMessage"></p>

        <button type="button" id="closeLoginError">
            Try Again
        </button>
    </dialog>

    <script src="/csrf.js"></script>
    <script src="/form-csrf.js"></script>
    <script src="/login.js"></script>
</body>
</html>
