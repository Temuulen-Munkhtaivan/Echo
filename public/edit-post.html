<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edit Post - Echo</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <main>
        <h1>Edit Post</h1>
        <p>Make changes to your post.</p>

        <p id="message">Loading post...</p>

        <form id="editForm" method="POST" hidden>
            <div>
                <label for="title">Title</label>
                <input type="text" id="title" name="title"
                    maxlength="120" required>
            </div>

            <div>
                <label for="content">Content</label>
                <textarea id="content" name="content"
                        rows="6" maxlength="5000" required></textarea>
            </div>

            <button type="submit">Save Changes</button>
        </form>

        <p><a href="/posts.html">Back to Posts</a></p>
    </main>

    <script src="/csrf.js"></script>

    <script>
        const params = new URLSearchParams(window.location.search);
        const postId = params.get("id");

        const form = document.getElementById("editForm");
        const message = document.getElementById("message");

        async function loadPost() {
            if (!postId || !/^[1-9]\d*$/.test(postId)) {
                message.textContent = "Invalid post ID.";
                return;
            }

            try {
                const response = await fetch("/posts");

                if (!response.ok) {
                    throw new Error("Failed to load posts");
                }

                const posts = await response.json();
                const post = posts.find(item => String(item.id) === postId);

                if (!post) {
                    message.textContent = "Post not found.";
                    return;
                }

                document.getElementById("title").value = post.title;
                document.getElementById("content").value = post.content;

                form.action = "/posts/" + postId + "/edit";
                form.hidden = false;
                addCsrfToken(form);
                message.textContent = "";

            } catch (err) {
                message.textContent = "Unable to load post.";
            }
        }

        loadPost();
    </script>
</body>
</html>
