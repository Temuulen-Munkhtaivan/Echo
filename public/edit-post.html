<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edit Post - Echo</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <main>
        <h1>Edit Post</h1>
        <p>Make changes to your post.</p>

        <p id="message">Loading post...</p>

        <form id="editForm" method="POST" hidden>
            <div>
                <label for="title">Title</label>
                <input type="text" id="title" name="title"
                    maxlength="120" required>
            </div>

            <div>
                <label for="content">Content</label>
                <textarea id="content" name="content"
                        rows="6" maxlength="5000" required></textarea>
            </div>

            <button type="submit">Save Changes</button>
        </form>

        <p><a href="/posts.html">Back to Posts</a></p>
    </main>

    <script src="/csrf.js"></script>
    <script src="/edit-post.js"></script>
</body>
</html>
